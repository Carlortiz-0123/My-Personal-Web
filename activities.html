   <div class="actcontainer">
    <div class="left">
        <h1 class="actfileh1">Activity Upload File</h1>

        <div class="inputact-file">
            <label class="lbla">File Name</label>
            <input type="text" id="actTitle"  placeholder="Enter your File Name" ><br><br>

            <label class="lbla">Upload File </label> 
            <input type="file" id="actFile" ><br><br>

            <label class="lbla">Upload Image</label>
            <input type="file" id="actImage" ><br><br>

            <button type="button" id="btnact" onclick="submitact()">Submit</button>
        </div>
        </div>

   <a href="carousel.html" class="lab1">Activity #1</a>

</div>
  
    </div>



   <script>
        const hamburger = document.getElementById("hamburger");
        const navbar = document.getElementById("navbar");
        const overlay = document.getElementById("overlay");

       
        hamburger.addEventListener("click", () => {
            navbar.classList.toggle("open");
            hamburger.classList.toggle("active");
            overlay.style.display = navbar.classList.contains("open") ? "block" : "none";
        });

     
        overlay.addEventListener("click", () => {
            navbar.classList.remove("open");
            hamburger.classList.remove("active");
            overlay.style.display = "none";
        });

        <!--uploadfiles-->
    function submitact() {
    var title = document.getElementById("actTitle").value;
    var file = document.getElementById("actFile").value;
    var image = document.getElementById("actImage").value;

    if (title === "" || file === "" || image === "") {
      alert("Please fill out all fields before submitting.");
    } else {
      alert("Activity uploaded successfully!");
    }
  }
    </script>
