<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

    <style>

         body {
            font-family: Arial, sans-serif;
            color: white;
            text-shadow: 5px 3px 5px black;
            background: url("bgimage.png") no-repeat center/cover;
            margin: 0;
            padding-top: 90px; 
            text-align: center;
            scroll-behavior: smooth;
            min-height: 100vh;
        }

          header {
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            padding: 15px 40px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            text-decoration: none;
            letter-spacing: 1px;
            margin-left: 10%;
        }

       
        nav.navbar {
           display: flex;
           gap: 15px;
           margin-right: 10%;
        }

        nav.navbar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            position: relative;
            transition: color 0.3s ease;
        }

        nav.navbar a:hover,
        nav.navbar a.active {
            color: #00ffcc;
        }

        nav.navbar a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0%;
            height: 2px;
            background: #00ffcc;
            transition: width 0.3s ease;
        }

        nav.navbar a:hover::after,
        nav.navbar a.active::after {
            width: 100%;
        }

         @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 15px;
            }

              nav.navbar {
                position: fixed;
                top: 65px;
                right: 15px;             
                background: rgba(0, 0, 0, 0.9);
                flex-direction: column;
                width: 220px;          
                max-width: 70vw;
                height: calc(100vh - 65px);
                padding: 30px 25px 30px 30px;  
                gap: 15px;
                transform: translateX(120%);  
                transition: transform 0.3s ease;
                z-index: 9999;
                box-shadow: -5px 0 15px rgba(0,0,0,0.7);
                border-radius: 0 0 0 15px;
                box-sizing: border-box; 
           }
           nav.navbar.open {
                transform: translateX(0);
            }

            nav.navbar a {
                font-size: 18px;
                padding-left: 20px;
            }

           
        }

        
.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
  width: 80%;
  max-width: 800px;
}

.grid-item {
  background: #fff;
  padding: 30px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  border-radius: 10px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.15);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.grid-item:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 18px rgba(0,0,0,0.25);
}


    </style>

</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">My Profile</a>

        <nav class="navbar" id="navbar">
            <a href="index.html">Home</a>
            <a href="activities.html" class="active">Activities</a>
            <a href="quiz.html">Quizzes</a>
            <a href="exam.html">Exams</a>
         
        </nav>
    </header>


    <div class="grid-container">
    <div class="grid-item">Box 1</div>
    <div class="grid-item">Box 2</div>
    <div class="grid-item">Box 3</div>
    <div class="grid-item">Box 4</div>
    <div class="grid-item">Box 5</div>
        
  </div>
</body>

</html>
