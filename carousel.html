<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple carousel · example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: url("bgimage.png") no-repeat center/cover;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      scroll-behavior: smooth;
    }

    .card {
      max-width: 800px;
      width: 100%;
      background: transparent;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 12px;
      border: 1px solid #00ffcc;
      box-shadow: 0 4px 12px rgba(0, 255, 204, 0.5);
      padding: 2rem 1.5rem;
      text-align: center;
    }

    h2 {
      font-family: fantasy;
      letter-spacing: 2px;
      color: #00ffcc;
      margin-bottom: 2rem;
      font-weight: 500;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .back-link img {
      height: 40px;
      width: 40px;
    }

    /* Carousel */
    .carousel {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      scroll-snap-type: x mandatory;
      padding: 0.5rem 0.2rem 1.5rem 0.2rem;
      scrollbar-width: thin;
      scrollbar-color: #063c31 #e5d9ff;
    }

    .carousel::-webkit-scrollbar {
      height: 8px;
    }
    .carousel::-webkit-scrollbar-track {
      background: #e5d9ff;
      border-radius: 20px;
    }
    .carousel::-webkit-scrollbar-thumb {
      background: #a58bd4;
      border-radius: 20px;
    }

    .carousel-item {
      flex: 0 0 auto;
      width: 230px;
      height: 130px;
      background: transparent;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 12px;
      border: 1px solid #00ffcc;
      box-shadow: 0 4px 12px rgba(0, 255, 204, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .note {
      margin-top: 3rem;
      background: transparent;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 12px;
      border: 1px solid #00ffcc;
      box-shadow: 0 4px 12px rgba(0, 255, 204, 0.5);
      padding: 0.8rem 1.2rem;
      color: #f0f0f0;
      font-size: 1rem;
    }

    .pic {
      text-align: center;           
      font-size: 16px;
      font-weight: bold;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      letter-spacing: 1px;
      color: #00ffcc;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      width: 200px;              
      margin: 10px auto;         
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid #00ffcc;
      box-shadow: 0 4px 12px rgba(0, 255, 204, 0.5);
      transition: all 0.3s ease; 
      display: inline-block;
    }

    .pic:hover {
      background: rgba(0, 255, 204, 0.2);
      color: white;
      box-shadow: 0 6px 16px rgba(0, 255, 204, 0.7);
      transform: translateY(-2px);   
    }

    /* Responsive */
    @media (max-width: 1024px) {
      h2 { font-size: 1.8rem; }
      .carousel-item { width: 180px; height: 110px; }
      .pic { width: 160px; font-size: 14px; }
    }

    @media (max-width: 768px) {
      h2 { font-size: 1.6rem; }
      .carousel-item { width: 150px; height: 100px; }
      .pic { width: 140px; font-size: 13px; }
    }

    @media (max-width: 480px) {
      h2 { font-size: 1.4rem; }
      .carousel { gap: 0.6rem; }
      .carousel-item { width: 120px; height: 80px; }
      .pic { width: 100px; font-size: 12px; padding: 8px; }
      .note { font-size: 0.8rem; padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>
      <a href="activities.html" class="back-link"><img src="back.png" alt="Back"></a>
      Simple Carousel
    </h2>

    <div class="carousel">
      <div class="carousel-item" id="item1"><img src="1st.jpg"></div>
      <div class="carousel-item" id="item2"><img src="2nd.jpg"></div>
      <div class="carousel-item" id="item3"><img src="3rd.jpg"></div>
      <div class="carousel-item" id="item4"><img src="4th.jpg"></div>
      <div class="carousel-item" id="item5"><img src="5th.jpg"></div>
      <div class="carousel-item" id="item6"><img src="6th.jpg"></div>
    </div>

    <br><br>
    <a href="#item1" class="pic">Item 1</a>
    <a href="#item2" class="pic">Item 2</a>
    <a href="#item3" class="pic">Item 3</a>
    <a href="#item4" class="pic">Item 4</a>
    <a href="#item5" class="pic">Item 5</a>
    <a href="#item6" class="pic">Item 6</a>

    <div class="note">
      swipe / drag → · snap enabled · pure CSS
    </div>

    <p class="note">
      <code>display: flex</code> + <code>overflow-x: auto</code> + <code>scroll-snap-type</code>
    </p>
  </div>
</body>
</html>
