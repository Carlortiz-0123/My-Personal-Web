<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple carousel · example</title>
  <style>
 body {
  background: url("bgimage.png") no-repeat center/cover;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;  
  padding: 1rem;
  scroll-behavior: smooth;
  position: relative;
}


.back-link {
  position: absolute;
  top: 20px;
  left: 20px;
}
.back-link img {
  max-height: 40px;
  max-width: 40px;
}

.card {
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  margin: 20px auto;
  padding: 30px;
  width: 90%;
  max-width: 100%;
  border-radius: 12px;
  border: 1px solid #00ffcc;
  box-shadow: 0 4px 12px rgba(0, 255, 204, 0.5);
  text-align: center;
}

h2 {
  margin-bottom: 1.8rem;
  font-weight: 700;
  font-size: 2.5rem;
  font-family: 'Times New Roman', Times, serif;
  letter-spacing: 2px;
  color: #00ffcc;
  text-shadow: 5px 5px 5px rgb(14, 14, 14);
}


.carousel {
  display: flex;
  overflow-x: auto;
  gap: 1rem;
  scroll-snap-type: x mandatory;
  padding: 0.5rem 0.2rem 1.5rem 0.2rem;
  scrollbar-width: thin;
  scrollbar-color: #067973 #e5d9ff;
}

.carousel::-webkit-scrollbar {
  height: 8px;
}
.carousel::-webkit-scrollbar-track {
  background: #e5d9ff;
  border-radius: 20px;
}
.carousel::-webkit-scrollbar-thumb {
  background: #1f6859;
  border-radius: 20px;
}

.carousel-item {
  scroll-snap-align: start;
  flex: 0 0 auto;
  width: 220px;
  height: 150px;
  background: transparent;
  border-radius: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #00ffcc;
  box-shadow: 0 4px 12px rgba(0, 255, 204, 0.5);
}

.carousel-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 1.4rem;
}


.item-btn {
  text-align: center;           
  font-size: 14px;
  font-weight: bold;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  letter-spacing: 1px;
  color: #00ffcc;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  width: 150px;                      
  padding: 12px 20px;
  border-radius: 12px;
  border: 1px solid #00ffcc;
  box-shadow: 0 0px 7px rgba(0, 255, 204, 0.7);
  transition: all 0.3s ease;     
  display: inline-block;
  margin: 5px;
}
.item-btn:hover {
  background: rgba(0, 255, 204, 0.2);
  color: white;
  box-shadow: 0 3px 10px rgba(0, 255, 204, 0.7);
  transform: translateY(-2px);   
}


.note, .p {
  margin-top: 1.5rem;
  color: #00ffcc;
  background: transparent;
  border: 1px solid #00ffcc;
  box-shadow: 0 0px 7px rgba(0, 255, 204, 0.7);
  padding: 0.8rem 1.2rem;
  border-radius: 3rem;
  font-size: 1rem;
}


@media (max-width: 1024px) {
  h2 { font-size: 2rem; }
  .carousel-item { width: 180px; height: 120px; }
}

@media (max-width: 768px) {
  h2 { font-size: 1.6rem; }
  .carousel-item { width: 150px; height: 100px; }
  .item-btn { width: 120px; font-size: 12px; padding: 10px; }
}

@media (max-width: 480px) {
  h2 { font-size: 1.2rem; letter-spacing: 1px; }
  .carousel { gap: 0.6rem; }
  .carousel-item { width: 120px; height: 80px; }
  .item-btn { width: 100px; font-size: 11px; padding: 8px; }
  .note, .p { font-size: 0.8rem; padding: 0.6rem 1rem; }
}
</style>
</head>
<body>
  <div class="card">
    <a href="activities.html" class="back-link"><img src="back.png" style=" max-height: 40px; max-width: 40px; margin-right: 100rem; "></a>
   
    <h2>Simple Carousel</h2>

    <div class="carousel">
      <div class="carousel-item" id="item1"> <img src="1st.jpg"></div>
      <div class="carousel-item" id="item2"> <img src="2nd.jpg"></div>
      <div class="carousel-item" id="item3"> <img src="3rd.jpg"></div>
      <div class="carousel-item" id="item4"> <img src="4th.jpg"></div>
      <div class="carousel-item" id="item5"> <img src="5th.jpg"></div>
      <div class="carousel-item" id="item6"> <img src="6th.jpg"></div>
    </div>

    <br><br>
    <a href="#item1" class="item-btn">ITEM 1</a>
    <a href="#item2" class="item-btn">ITEM 2</a>
    <a href="#item3" class="item-btn">ITEM 3</a>
    <a href="#item4" class="item-btn">ITEM 4</a>
    <a href="#item5" class="item-btn">ITEM 5</a>
    <a href="#item6" class="item-btn">ITEM 6</a>

    <div class="note">
      swipe / drag → · snap enabled · pure CSS
    </div>

    <p class="p">
      <code>display: flex</code> + <code>overflow-x: auto</code> + <code>scroll-snap-type</code>
    </p>
  </div>
</body>
</html>
