<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple carousel · example</title>
  <style>

    body {
      background: url("bgimage.png") no-repeat center/cover;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      scroll-behavior: smooth;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 12px;
      border: 1px solid #00ffcc;
      box-shadow: 0 4px 12px rgba(0, 255, 204, 0.5);
      text-align: center;
      width: 100%;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 1.8rem;
      font-weight: 700;
      font-size: clamp(1.4rem, 5vw, 3rem);
      font-family: 'Times New Roman', Times, serif;
      letter-spacing: 2px;
      color: #00ffcc;
      text-shadow: 5px 5px 5px rgb(14, 14, 14);
    }

    /* ---------- SIMPLE CAROUSEL ---------- */
    .carousel {
      display: flex;
      overflow-x: auto;
      gap: clamp(0.6rem, 2vw, 1.2rem);
      scroll-snap-type: x mandatory;
      padding: clamp(0.5rem, 2vh, 1.5rem) clamp(0.2rem, 2vw, 0.2rem);
      scrollbar-width: thin;
      scrollbar-color: #067973 #e5d9ff;
      -webkit-overflow-scrolling: touch;
    }

    .carousel::-webkit-scrollbar {
      height: clamp(6px, 1.5vw, 8px);
    }
    .carousel::-webkit-scrollbar-track {
      background: #e5d9ff;
      border-radius: 20px;
    }
    .carousel::-webkit-scrollbar-thumb {
      background: #1f6859;
      border-radius: 20px;
    }

    .carousel-item {
      scroll-snap-align: start;
      flex: 0 0 auto;
      width: clamp(100px, 28vw, 220px);
      height: clamp(70px, 18vw, 150px);
      background: transparent;
      border-radius: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #00ffcc;
      box-shadow: 0 4px 12px rgba(0, 255, 204, 0.5);
      min-width: clamp(100px, 28vw, 220px);
    }

    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1.4rem;
      justify-content: center;
    }

    .note {
      margin-top: 2rem;
      color: #00ffcc;
      background: transparent;
      border: 1px solid #00ffcc;
      box-shadow: 0 0px 7px rgba(0, 255, 204, 0.7);
      padding: clamp(0.6rem, 2vh, 0.8rem) clamp(1rem, 3vw, 1.2rem);
      border-radius: 3rem;
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      display: inline-block;
    }

    .p {
      margin: 1.8rem 0 2rem 0;
      color: #00ffcc;
      background: transparent;
      border: 1px solid #00ffcc;
      box-shadow: 0 0px 7px rgba(0, 255, 204, 0.7);
      padding: clamp(0.6rem, 2vh, 0.8rem) clamp(1rem, 3vw, 1.2rem);
      border-radius: 3rem;
      font-size: clamp(0.8rem, 2.5vw, 1rem);
      display: inline-block;
    }

    .item-btn {
      text-align: center;           
      font-size: clamp(11px, 2vw, 14px);
      font-weight: bold;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      letter-spacing: 1px;
      color: #00ffcc;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      width: clamp(90px, 18vw, 150px);                      
      padding: clamp(8px, 2vh, 12px) clamp(15px, 4vw, 20px);
      border-radius: 12px;
      border: 1px solid #00ffcc;
      box-shadow: 0 0px 7px rgba(0, 255, 204, 0.7);
      transition: all 0.3s ease;     
      display: inline-block;
      margin: clamp(3px, 1vw, 5px);
      white-space: nowrap;
      box-sizing: border-box;
    }
    .item-btn:hover {
      background: rgba(0, 255, 204, 0.2);
      color: white;
      box-shadow: 0 3px 10px rgba(0, 255, 204, 0.7);
      transform: translateY(-2px);   
    }

    /* ---------- RESPONSIVE DESIGN ---------- */
    @media (max-width: 1200px) {
      body {
        padding: 15px;
      }
      .card {
        margin: 15px auto;
        padding: 18px;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
        align-items: flex-start;
        min-height: 100vh;
      }
      .card {
        margin: 10px auto;
        padding: 15px;
      }
      .carousel {
        padding: 0.8rem 0.3rem 1.2rem 0.3rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }
      .card {
        margin: 8px auto;
        padding: 12px;
      }
      .carousel {
        gap: 0.8rem;
      }
    }

    @media (max-width: 360px) {
      body {
        padding: 5px;
      }
      .card {
        padding: 10px;
        margin: 5px auto;
      }
      .item-btn {
        width: 100%;
        max-width: 140px;
      }
    }

    /* Landscape mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        padding: 10px;
        align-items: flex-start;
      }
      .card {
        margin: 10px auto;
      }
      h2 {
        margin-bottom: 1rem;
        font-size: clamp(1.2rem, 4vw, 2rem);
      }
      .carousel {
        gap: 0.8rem;
      }
      .note, .p {
        margin-top: 1rem;
        font-size: clamp(0.7rem, 2vw, 0.9rem);
      }
    }

  </style>
</head>
<body>
  <div class="card">
    <a href="activities.html" class="back-link"><img src="back.png" style=" max-height: 40px; max-width: 40px; margin-right: 100rem; "></a>
   
    <h2>Simple Carousel</h2>

    <div class="carousel">
      <div class="carousel-item" id="item1"> <img src="1st.jpg"></div>
      <div class="carousel-item" id="item2"> <img src="2nd.jpg"></div>
      <div class="carousel-item" id="item3"> <img src="3rd.jpg"></div>
      <div class="carousel-item" id="item4"> <img src="4th.jpg"></div>
      <div class="carousel-item" id="item5"> <img src="5th.jpg"></div>
      <div class="carousel-item" id="item6"> <img src="6th.jpg"></div>
    </div>

    <br><br>
    <a href="#item1" class="item-btn">ITEM 1</a>
    <a href="#item2" class="item-btn">ITEM 2</a>
    <a href="#item3" class="item-btn">ITEM 3</a>
    <a href="#item4" class="item-btn">ITEM 4</a>
    <a href="#item5" class="item-btn">ITEM 5</a>
    <a href="#item6" class="item-btn">ITEM 6</a>

    <div class="note">
      swipe / drag → · snap enabled · pure CSS
    </div>

    <p class="p">
      <code>display: flex</code> + <code>overflow-x: auto</code> + <code>scroll-snap-type</code>
    </p>
  </div>
</body>
</html>
