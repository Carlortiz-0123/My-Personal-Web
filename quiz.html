<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title> 

</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">My Profile</a>

        <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>

        <nav class="navbar" id="navbar">
            <a href="index.html">Home</a>
              <a href="dashboard.html">Dashboard</a>
            <a href="activities.html">Activities</a>
            <a href="quiz.html" class="active">Quizzes</a>
            <a href="exam.html">Exams</a>
         
        </nav>
    </header>

     <div class="quizcontainer">
        <div class="leftq">
        <h1 class="quizfileh1">Quiz Upload File</h1>

        <div class="inputq-file">
            <label class="lblq">File Name</label>
            <input type="text" id="quizTitle"  placeholder="Enter your File Name" ><br><br>

            <label class="lblq">Upload File </label> 
            <input type="file" id="quizFile" ><br><br>

            <label class="lblq">Upload Image</label>
            <input type="file" id="quizImage" ><br><br>

            <button type="button" id="btnquiz" onclick="submitQuiz()">Submit</button>
        </div>
     </div>
     <div class="rightq">
         <h4> Uploaded Quiz </h4><br>
         
        <div class="carousel">
        <div class="quiz-card"><img src="Q1.jpg"></div>
        <div class="quiz-card"><img src="Q2.jpg"></div>
        <div class="quiz-card"><img src="Q3.jpg"></div>
        <div class="quiz-card"><img src="longQ.jpg"></div>
             <div class="quiz-card"><img src="FinalQ1.jpg"></div>
              <div class="quiz-card"><img src="FinalQ2.jpg"></div>
            
        </div>
         
     </div>
    </div>



<script>
        const hamburger = document.getElementById("hamburger");
        const navbar = document.getElementById("navbar");
        const overlay = document.getElementById("overlay");

       
        hamburger.addEventListener("click", () => {
            navbar.classList.toggle("open");
            hamburger.classList.toggle("active");
            overlay.style.display = navbar.classList.contains("open") ? "block" : "none";
        });

     
        overlay.addEventListener("click", () => {
            navbar.classList.remove("open");
            hamburger.classList.remove("active");
            overlay.style.display = "none";
        });

        <!--uploadfiles-->
    function submitQuiz() {
    var title = document.getElementById("quizTitle").value;
    var file = document.getElementById("quizFile").value;
    var image = document.getElementById("quizImage").value;

    if (title === "" || file === "" || image === "") {
      alert("Please fill out all fields before submitting.");
    } else {
      alert("Quiz uploaded successfully!");
    }
  }
    </script>

</body>
</html>
