 <script>
        const hamburger = document.getElementById("hamburger");
        const navbar = document.getElementById("navbar");
        const overlay = document.getElementById("overlay");

       
        hamburger.addEventListener("click", () => {
            navbar.classList.toggle("open");
            hamburger.classList.toggle("active");
            overlay.style.display = navbar.classList.contains("open") ? "block" : "none";
        });

     
        overlay.addEventListener("click", () => {
            navbar.classList.remove("open");
            hamburger.classList.remove("active");
            overlay.style.display = "none";
        });


<!--uploadfiles-->
function submitExam() {
    var title = document.getElementById("examTitle").value;
    var file = document.getElementById("examFile").value;
    var image = document.getElementById("examImage").value;

    if (title === "" || file === "" || image === "") {
      alert("Please fill out all fields before submitting.");
    } else {
      alert("Exam uploaded successfully!");
    }
  }

    </script>
